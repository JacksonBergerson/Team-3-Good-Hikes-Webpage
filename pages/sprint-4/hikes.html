        <script defer src="/js/sprint-4/load-hike.js"></script>
        <script defer src="/js/sprint-4/basic-filter.js"></script>
    </head>

    <body>
        <div class="filterButtonDiv">
            <!-- ROW 1: Difficulty Checkboxes -->
            <div class="filter-row">
                <span class="filter-label">Difficulty:</span>
                <label class="filter-option" data-difficulty-band="beginner">
                    <input type="checkbox" onchange="checkStatus1(this)"> Beginner (1-2)
                </label>
                <label class="filter-option" data-difficulty-band="easy">
                    <input type="checkbox" onchange="checkStatus3(this)"> Easy (3-4)
                </label>
                <label class="filter-option" data-difficulty-band="moderate">
                    <input type="checkbox" onchange="checkStatus5(this)"> Moderate (5-6)
                </label>
                <label class="filter-option" data-difficulty-band="hard">
                    <input type="checkbox" onchange="checkStatus7(this)"> Hard (7-8)
                </label>
                <label class="filter-option" data-difficulty-band="strenuous">
                    <input type="checkbox" onchange="checkStatus9(this)"> Strenuous (9-10)
                </label>
            </div>

            <!-- =====================================================================
                OPTIONAL EXTRA FILTERS (ROWS 2-4)
                To hide any row or individual filter below, highlight it and press
                Ctrl + / in VS Code to comment it out. Keep the Row 4 <div class="filter-row">
                wrapper and the two <button> tags uncommented so the buttons stay visible!
                ===================================================================== -->

            <!-- ROW 2 (OPTIONAL): Park Name & Hike Style Dropdowns -->
            <div class="filter-row">
                <label class="filter-option" for="park-name-filter">
                    Park:
                    <select id="park-name-filter">
                        <option value="">All Parks</option>
                    </select>
                </label>

                <label class="filter-option" for="hike-style-filter">
                    Style:
                    <select id="hike-style-filter">
                        <option value="">Any Style</option>
                    </select>
                </label>
            </div>

            <!-- ROW 3 (OPTIONAL): Min & Max Distance and Elevation Inputs -->
            <div class="filter-row">
                <label class="filter-option" for="min-hike-distance-filter">
                    Min Distance (mi):
                    <input type="number" id="min-hike-distance-filter" min="0" step="0.1" placeholder="0">
                </label>

                <label class="filter-option" for="max-hike-distance-filter">
                    Max Distance (mi):
                    <input type="number" id="max-hike-distance-filter" min="0" step="0.1" placeholder="e.g. 6.0">
                </label>

                <label class="filter-option" for="min-elevation-gain-filter">
                    Min Elevation (ft):
                    <input type="number" id="min-elevation-gain-filter" min="0" step="100" placeholder="0">
                </label>

                <label class="filter-option" for="max-elevation-gain-filter">
                    Max Elevation (ft):
                    <input type="number" id="max-elevation-gain-filter" min="0" step="100" placeholder="e.g. 2000">
                </label>
            </div>

            <!-- ROW 4: Optional Terrain Keyword Search + Always-Active Action Buttons -->
            <div class="filter-row">
                <!-- OPTIONAL: Comment out just this <label> block to hide the Terrain Keyword box -->
                <label class="filter-option" for="terrain-type-filter">
                    Terrain Keyword:
                    <input type="text" id="terrain-type-filter" placeholder="e.g. gravel, paved, dirt">
                </label>

                <!-- KEEP ACTIVE: Action Buttons stay on Row 4 even if Terrain Keyword is commented out -->
                <button type="button" onclick="filterHikes4()">Apply Filters</button>
                <button type="button" onclick="resetFilters()">Reset</button>
            </div>
        </div>

        
        <!-- Do not delete <div class="hike-list"></div> below.
                This empty <div> is the container where load-hike.js inserts all of the hike cards on the page.
                Even though it looks empty in hikes.html, load-hike.js searches for it by class name
                (document.querySelector('.hike-list')) inside renderHikes()
                and appends every generated hike card inside it (hikeList.appendChild(cards[i])).
        -->
        <div class="hike-list"></div>
    </body>
</html>
